<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text-muted: #6b6b66;
      --text-faint: #9a9a94;
      --accent: #534AB7;
      --accent-light: #EEEDFE;
      --code-fg: #D85A30;
      --code-bg: #f3f2ef;
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1c1c1a;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(255,255,255,0.18);
        --text: #ebebdf;
        --text-muted: #9a9a90;
        --text-faint: #666660;
        --accent: #AFA9EC;
        --accent-light: #26215C;
        --code-fg: #F0997B;
        --code-bg: #252522;
      }
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout ── */
    body {
      display: grid;
      grid-template-rows: 56px 1fr;
      height: 100vh;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 24px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #app-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-right: 4px;
    }

    #divider {
      width: 0.5px;
      height: 20px;
      background: var(--border-strong);
      margin: 0 4px;
    }

    #file-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      border-radius: var(--radius);
      background: var(--bg);
      border: 0.5px solid var(--border-strong);
      color: var(--text);
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    #file-btn:hover { background: var(--surface); border-color: var(--accent); }
    #file-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    #file-input { display: none; }

    #filename-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--accent-light);
      color: var(--accent);
      border: 0.5px solid var(--border);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    #toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    #demo-btn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.15s;
    }
    #demo-btn:hover { background: var(--bg); }

    /* ── Main area ── */
    #main {
      overflow-y: auto;
      padding: 3rem 24px 4rem;
    }

    /* ── Empty state ── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      height: 100%;
      color: var(--text-faint);
    }
    #empty-state .drop-zone {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 3rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #empty-state .drop-zone:hover, #empty-state .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    #empty-state svg { width: 40px; height: 40px; stroke: var(--text-faint); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #empty-state .drop-zone:hover svg, #empty-state .drop-zone.drag-over svg { stroke: var(--accent); }
    #empty-state p { font-size: 14px; text-align: center; line-height: 1.6; }
    #empty-state .hint { font-size: 12px; color: var(--text-faint); }

    /* ── Preview ── */
    #preview {
      display: none;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── Markdown styles ── */
    #preview h1 {
      font-family: 'Lora', serif;
      font-size: 2.1rem;
      font-weight: 600;
      line-height: 1.2;
      margin: 0 0 1.25rem;
      color: var(--text);
    }
    #preview h2 {
      font-family: 'Lora', serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin: 2.5rem 0 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 0.5px solid var(--border);
      color: var(--text);
    }
    #preview h3 {
      font-size: 1.1rem;
      font-weight: 500;
      margin: 1.75rem 0 0.5rem;
      color: var(--text);
    }
    #preview h4 {
      font-size: 1rem;
      font-weight: 500;
      margin: 1.25rem 0 0.4rem;
      color: var(--text-muted);
    }
    #preview h5, #preview h6 {
      font-size: 0.9rem;
      font-weight: 500;
      margin: 1rem 0 0.3rem;
      color: var(--text-muted);
    }
    #preview p {
      font-size: 16px;
      line-height: 1.85;
      color: var(--text);
      margin: 0 0 1.1rem;
    }
    #preview a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #preview ul, #preview ol {
      padding-left: 1.6rem;
      margin: 0 0 1.1rem;
    }
    #preview li {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 0.3rem;
      color: var(--text);
    }
    #preview li > ul, #preview li > ol {
      margin: 0.3rem 0 0.3rem;
    }
    #preview code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--code-fg);
      border: 0.5px solid var(--border);
    }
    #preview pre {
      background: var(--code-bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.3rem;
      margin: 0 0 1.3rem;
      overflow-x: auto;
    }
    #preview pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.7;
    }
    #preview blockquote {
      border-left: 3px solid var(--accent);
      margin: 0 0 1.1rem;
      padding: 0.6rem 0 0.6rem 1.3rem;
      background: var(--accent-light);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    #preview blockquote p {
      color: var(--text-muted);
      font-style: italic;
      margin: 0;
    }
    #preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 1.3rem;
      font-size: 14.5px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    #preview thead { background: var(--code-bg); }
    #preview th {
      font-weight: 500;
      text-align: left;
      padding: 9px 14px;
      border-bottom: 0.5px solid var(--border-strong);
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    #preview td {
      padding: 9px 14px;
      border-bottom: 0.5px solid var(--border);
      color: var(--text);
    }
    #preview tr:last-child td { border-bottom: none; }
    #preview tr:hover td { background: var(--code-bg); }
    #preview img {
      max-width: 100%;
      border-radius: var(--radius);
      margin: 0.5rem 0;
      border: 0.5px solid var(--border);
    }
    #preview hr {
      border: none;
      border-top: 0.5px solid var(--border-strong);
      margin: 2.5rem 0;
    }
    #preview strong { font-weight: 500; }
    #preview em { font-style: italic; }
    #preview del { text-decoration: line-through; color: var(--text-muted); }

    /* ── Drag-over on body ── */
    body.drag-active #main { outline: 3px dashed var(--accent); outline-offset: -8px; border-radius: var(--radius-lg); }
  </style>
</head>
<body>

  <div id="toolbar">
    <span id="app-title">Markdown Viewer</span>
    <div id="divider"></div>
    <button id="file-btn" onclick="document.getElementById('file-input').click()">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      .md Datei öffnen
    </button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt" />
    <span id="filename-badge"></span>
    <div id="toolbar-right">
      <button id="demo-btn" onclick="loadDemo()">Demo anzeigen</button>
    </div>
  </div>

  <div id="main">
    <div id="empty-state">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="12" y2="12"/><line x1="15" y1="15" x2="12" y2="12"/></svg>
        <p><strong>Datei hierher ziehen</strong><br />oder klicken zum Auswählen</p>
        <span class="hint">.md · .markdown · .txt</span>
      </div>
    </div>

    <div id="preview"></div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const preview   = document.getElementById('preview');
    const emptyState = document.getElementById('empty-state');
    const filenameBadge = document.getElementById('filename-badge');
    const dropZone  = document.getElementById('drop-zone');

    marked.setOptions({ breaks: true, gfm: true });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) readFile(file);
    });

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = (ev) => renderMarkdown(ev.target.result, file.name);
      reader.readAsText(file, 'UTF-8');
    }

    function renderMarkdown(text, name) {
      preview.innerHTML = marked.parse(text);
      preview.style.display = 'block';
      emptyState.style.display = 'none';
      filenameBadge.textContent = name || 'dokument.md';
      filenameBadge.style.display = 'inline-flex';
      document.title = (name || 'Dokument') + ' – Markdown Viewer';
    }

    /* Drag & Drop */
    ['dragenter', 'dragover'].forEach(ev => {
      document.addEventListener(ev, (e) => {
        e.preventDefault();
        document.body.classList.add('drag-active');
        dropZone.classList.add('drag-over');
      });
    });
    ['dragleave', 'drop'].forEach(ev => {
      document.addEventListener(ev, (e) => {
        e.preventDefault();
        document.body.classList.remove('drag-active');
        dropZone.classList.remove('drag-over');
      });
    });
    document.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) readFile(file);
    });

    /* Demo content */
    function loadDemo() {
      const demo = `# Markdown Viewer Demo

Willkommen! Dies zeigt, wie **Markdown** gerendert wird.

## Textformatierung

Normal, **fett**, *kursiv*, ~~durchgestrichen~~, und \`inline code\`.

## Listen

- Erster Punkt
- Zweiter Punkt
  - Verschachtelt
  - Noch einer
- Dritter Punkt

1. Nummerierter Eintrag
2. Noch einer
3. Und ein dritter

## Code-Block

\`\`\`javascript
function greet(name) {
  return \`Hallo, \${name}!\`;
}

console.log(greet("Welt"));
\`\`\`

## Zitat

> Dies ist ein Blockquote. Gut für Hinweise, Zitate
> oder wichtige Anmerkungen.

## Tabelle

| Sprache    | Typ          | Beliebt seit |
|------------|--------------|--------------|
| JavaScript | Dynamisch    | 1995         |
| Python     | Dynamisch    | 1991         |
| Rust       | Statisch     | 2010         |
| Go         | Statisch     | 2009         |

---

*Ziehe deine eigene \`.md\` Datei in das Fenster oder klicke auf „.md Datei öffnen".*`;

      renderMarkdown(demo, 'demo.md');
    }
  </script>
</body>
</html>
